name: Ops Diagnose

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
      GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
    steps:
      - name: Check repository secret availability
        shell: bash
        run: |
          for name in VERCEL_TOKEN GATE_API_KEY GATE_API_SECRET; do
            if [ -n "${!name}" ]; then echo "$name=present"; else echo "$name=missing"; fi
          done

      - name: Probe production endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          bases = [
              "https://maetajak.vercel.app",
              "https://maetajak-trading.vercel.app",
          ]
          for base in bases:
              print(f"BASE={base}")
              for path in ["/api/health", "/api/dashboard"]:
                  url = base + path
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"tooja-ops-diagnose/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          body = r.read().decode("utf-8", "replace")
                          status = r.status
                  except urllib.error.HTTPError as e:
                      status = e.code
                      body = e.read().decode("utf-8", "replace")
                  except Exception as e:
                      print(path, "REQUEST_ERROR", type(e).__name__, str(e))
                      continue
                  print(path, "HTTP", status)
                  try:
                      data = json.loads(body)
                      if path == "/api/health":
                          print("health", {k:data.get(k) for k in ["ok","service","gateConfigured","accessProtected"]})
                      else:
                          print("dashboard", {
                              "mode": data.get("mode"),
                              "error": data.get("error"),
                              "positionsCount": len(data.get("positions") or []) if isinstance(data, dict) else None,
                          })
                  except Exception:
                      print("non_json_prefix", body[:160].replace("\n", " "))
          PY
